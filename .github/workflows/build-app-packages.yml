name: Build App Packages and Collect App Information

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/collect_app_info.py'
  schedule:
    - cron: "0 0 * * *" # Run at midnight UTC every day

# Cancel old builds when a new one starts (new build includes all apps)
concurrency:
  group: build-app-packages
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      tokens: ${{ steps.scope.outputs.tokens }}
    permissions:
      contents: read

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Catalog publication runs must use refs/heads/main"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Make scrapers executable
        run: chmod +x .github/scripts/scrapers/*.sh

      # A push that only appends cask URLs (an approved app request) needs just
      # that app packaged. Processing all of them costs about 13 minutes of
      # Azure lookups for apps that are already built. The nightly schedule and
      # manual runs still cover everything.
      - name: Determine build scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          full_build() {
            echo "Full build: $1"
            echo "scope=all" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [ "$EVENT_NAME" = "push" ] || full_build "triggered by $EVENT_NAME"

          case "$BEFORE_SHA" in
            ""|0000000000000000000000000000000000000000)
              full_build "no usable base commit" ;;
          esac

          # The checkout is shallow, so compare through the API rather than git.
          patch=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$GITHUB_SHA" \
            --jq '.files[] | select(.filename == ".github/scripts/collect_app_info.py") | .patch' 2>/dev/null) \
            || full_build "could not read the diff"

          [ -n "$patch" ] || full_build "collect_app_info.py not in this push"

          changed=$(printf '%s\n' "$patch" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)

          # Anything other than a list entry means the collector logic itself
          # changed, and every app has to be re-collected.
          other=$(printf '%s\n' "$changed" \
            | grep -vE '^[+-][[:space:]]*"https://formulae\.brew\.sh/api/cask/[^"]+\.json",?[[:space:]]*$' || true)
          if [ -n "$other" ]; then
            echo "Changes beyond list entries:"
            printf '%s\n' "$other" | head -20
            full_build "collect_app_info.py changed beyond cask list entries"
          fi

          tokens=$(printf '%s\n' "$changed" | grep -E '^\+' \
            | grep -oE 'cask/[^"]+\.json' | sed 's|cask/||; s|\.json||' | sort -u | tr '\n' ' ')

          [ -n "$tokens" ] || full_build "no casks were added"

          echo "Scoped build for: $tokens"
          echo "scope=partial" >> "$GITHUB_OUTPUT"
          echo "tokens=$tokens" >> "$GITHUB_OUTPUT"

      - name: Collect app information
        run: python .github/scripts/collect_app_info.py

      - name: Create collection patch
        run: |
          git add -A -- Apps README.md supported_apps.json
          git diff --cached --binary --full-index > catalog-collection.patch
          git reset

      - name: Upload collection patch
        uses: actions/upload-artifact@v4
        with:
          name: catalog-collection-${{ github.run_id }}
          path: catalog-collection.patch
          if-no-files-found: error
          retention-days: 1

  build:
    needs: collect
    runs-on: macos-latest
    environment: catalog-storage

    # The job-scoped token is sufficient for catalog commits and issue comments.
    permissions:
      contents: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Azure storage configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_BASE_URL: ${{ vars.AZURE_STORAGE_BASE_URL }}
        run: |
          missing=()
          for variable in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            AZURE_STORAGE_ACCOUNT \
            AZURE_STORAGE_CONTAINER \
            AZURE_STORAGE_BASE_URL; do
            if [ -z "${!variable:-}" ]; then
              missing+=("$variable")
            fi
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required catalog-storage environment variables: ${missing[*]}"
            exit 1
          fi

          case "$AZURE_STORAGE_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::AZURE_STORAGE_BASE_URL must be an HTTPS URL"
              exit 1
              ;;
          esac

          case "$AZURE_STORAGE_BASE_URL" in
            *\?*|*\#*)
              echo "::error::AZURE_STORAGE_BASE_URL must be a stable blob container URL without a query string or fragment"
              exit 1
              ;;
          esac

      - name: Download collection patch
        uses: actions/download-artifact@v4
        with:
          name: catalog-collection-${{ github.run_id }}

      - name: Apply collection patch
        run: |
          if [ -s catalog-collection.patch ]; then
            git apply --whitespace=nowarn catalog-collection.patch
          else
            echo "Collector produced no repository changes"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Find apps needing packaging
        id: find-apps
        env:
          BUILD_SCOPE: ${{ needs.collect.outputs.scope }}
          SCOPE_TOKENS: ${{ needs.collect.outputs.tokens }}
        run: |
          echo "Finding apps that need special packaging..."
          all_apps=()
          scoped_apps=()
          scoped_files_seen=0

          for file in Apps/*.json; do
            [ -f "$file" ] || continue

            cask=$(jq -r '.homebrew_cask // empty' "$file")
            in_scope=false
            if [ -n "$cask" ] && [[ " $SCOPE_TOKENS " == *" $cask "* ]]; then
              in_scope=true
              scoped_files_seen=$((scoped_files_seen + 1))
            fi

            if [ "$(jq -r '.deprecated // false' "$file")" = "true" ]; then
              echo "Skipping deprecated app: $(basename "$file" .json)"
              continue
            fi

            # Only these types are repackaged. A plain dmg and a plain pkg are
            # both served straight from the vendor URL, so neither enters the
            # build list. "Process apps" skips a pkg anyway through its own type
            # guard, and queuing one only added log noise.
            type=$(jq -r '.type // empty' "$file")
            case "$type" in
              app|pkg_in_dmg|pkg_in_pkg) ;;
              *) continue ;;
            esac

            entry="$(basename "$file" .json):$(jq -r '.url' "$file")"
            all_apps+=("$entry")
            [ "$in_scope" = true ] && scoped_apps+=("$entry")
          done

          apps_to_build=("${all_apps[@]}")
          if [ "$BUILD_SCOPE" = "partial" ]; then
            if [ ${#scoped_apps[@]} -gt 0 ]; then
              apps_to_build=("${scoped_apps[@]}")
              echo "Scoped build: packaging ${#scoped_apps[@]} of ${#all_apps[@]} apps, skipping the rest"
            elif [ "$scoped_files_seen" -gt 0 ]; then
              # The added apps exist but need no repackaging, so there is
              # genuinely nothing to build.
              apps_to_build=()
              echo "Scoped build: added apps need no packaging, nothing to build"
            else
              # The added cask produced no app file at all, usually a display
              # name collision. Build everything rather than silently skipping.
              echo "No app file matched the added casks ($SCOPE_TOKENS), falling back to a full build"
            fi
          fi

          echo "APPS_TO_BUILD=${apps_to_build[*]}" >> $GITHUB_ENV
          echo "Found apps: ${apps_to_build[*]}"

      - name: Log in to Azure with GitHub OIDC
        id: azure-login
        if: env.APPS_TO_BUILD != ''
        uses: azure/login@v3
        env:
          AZURE_LOGIN_PRE_CLEANUP: true
          AZURE_LOGIN_POST_CLEANUP: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create supported_apps.json
        run: python .github/scripts/generate_supported_apps.py --allow-incomplete

      - name: Process apps
        id: process-apps
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_BASE_URL: ${{ vars.AZURE_STORAGE_BASE_URL }}
        run: |
          WORKSPACE_DIR=$(pwd)
          STORAGE_BASE_URL="${AZURE_STORAGE_BASE_URL%/}"

          # bundleId drives Intune app detection, so it is read back from the
          # artifact that was actually built instead of trusting the cask
          # heuristic. The helpers print the id on stdout and every diagnostic
          # on stderr, and they always exit 0: bundle id verification must never
          # fail an app, packaging is what counts.
          extract_bundle_id_from_plist() {
            local plist="$1"
            local bundle_id=""
            # plutil is resolved through PATH, PlistBuddy only exists at an
            # absolute path outside it.
            if [ -f "$plist" ]; then
              bundle_id=$(plutil -extract CFBundleIdentifier raw -o - "$plist" 2>/dev/null) || bundle_id=""
            fi
            if [ -z "$bundle_id" ]; then
              echo "Could not read CFBundleIdentifier from $plist, bundleId left unchanged" >&2
              return 0
            fi
            echo "$bundle_id"
            return 0
          }

          extract_bundle_id_from_pkg() {
            local pkg_path="$1"
            local expand_dir=""
            local plist=""
            if ! expand_dir=$(mktemp -d 2>/dev/null); then
              echo "Could not create a temporary directory to inspect $pkg_path, bundleId left unchanged" >&2
              return 0
            fi
            # --expand-full also unpacks Payload, so .app bundles end up as real
            # directories. Packages without an .app payload (system extensions,
            # drivers) legitimately yield nothing here.
            if pkgutil --expand-full "$pkg_path" "$expand_dir/payload" >/dev/null 2>&1; then
              # Shortest path wins so a nested helper bundle inside Frameworks
              # cannot shadow the top level app.
              plist=$(find "$expand_dir/payload" -type f -path "*.app/Contents/Info.plist" -print 2>/dev/null | awk '{ print length, $0 }' | sort -n | head -1 | cut -d" " -f2-)
              if [ -n "$plist" ]; then
                extract_bundle_id_from_plist "$plist"
              else
                echo "No .app payload inside $pkg_path, bundleId left unchanged" >&2
              fi
            else
              echo "Could not expand $pkg_path, bundleId left unchanged" >&2
            fi
            rm -rf "$expand_dir"
            return 0
          }

          log_bundle_id_change() {
            local json_path="$1"
            local new_id="$2"
            local current_id=""
            [ -n "$new_id" ] || return 0
            current_id=$(jq -r '.bundleId // empty' "$json_path" 2>/dev/null) || current_id=""
            if [ "$current_id" != "$new_id" ]; then
              echo "bundleId changed in $json_path: ${current_id:-none} -> $new_id"
            fi
            return 0
          }

          is_storage_package_url() {
            case "$1" in
              "$STORAGE_BASE_URL"/*) return 0 ;;
              https://intunebrew.blob.core.windows.net/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          artifact_kind() {
            local path="${1%%\?*}"
            path="${path%%\#*}"
            path=$(printf '%s' "$path" | tr '[:upper:]' '[:lower:]')
            case "$path" in
              *.pkg) echo "pkg" ;;
              *.dmg.gz) echo "dmg_gzip" ;;
              *.dmg) echo "dmg" ;;
              *.zip|*.tar.gz|*.tgz|*.tar.xz|*.tar.bz2|*.tbz) echo "archive" ;;
              *) echo "unknown" ;;
            esac
          }

          safe_artifact_relative_path() {
            local value=""
            local component=""
            value=$(printf '%s' "$1" | tr '\\' '/')
            case "$value" in
              ""|"."|/*|[A-Za-z]:*|*[$'\n\r\t']*) return 1 ;;
            esac
            IFS='/' read -r -a components <<< "$value"
            for component in "${components[@]}"; do
              case "$component" in
                ""|"."|".."|*"*"*|*"?"*|*"["*|*"]"*) return 1 ;;
              esac
            done
            printf '%s\n' "$value"
          }

          resolved_payload_path() {
            local root="$1"
            local candidate="$2"
            python -c 'import pathlib, sys; root=pathlib.Path(sys.argv[1]).resolve(strict=True); candidate=pathlib.Path(sys.argv[2]).resolve(strict=True); candidate.relative_to(root); print(candidate)' \
              "$root" "$candidate" 2>/dev/null
          }

          find_declared_payload() {
            local root="$1"
            local expected="$2"
            local payload_type="$3"
            local normalized=""
            local candidate=""
            local resolved=""
            local matches=()
            normalized=$(safe_artifact_relative_path "$expected") || {
              echo "Rejected unsafe Homebrew artifact path: $expected" >&2
              return 0
            }

            candidate="$root/$normalized"
            if { [ "$payload_type" = "app" ] && [ -d "$candidate" ]; } \
              || { [ "$payload_type" = "pkg" ] && [ -f "$candidate" ]; }; then
              resolved=$(resolved_payload_path "$root" "$candidate") || return 0
              printf '%s\n' "$resolved"
              return 0
            fi

            # Homebrew archives sometimes add one release-directory wrapper.
            # Accept it only when exactly one immediate wrapper resolves.
            for wrapper in "$root"/*; do
              [ -d "$wrapper" ] || continue
              candidate="$wrapper/$normalized"
              if { [ "$payload_type" = "app" ] && [ -d "$candidate" ]; } \
                || { [ "$payload_type" = "pkg" ] && [ -f "$candidate" ]; }; then
                resolved=$(resolved_payload_path "$root" "$candidate") || continue
                matches+=("$resolved")
              fi
            done
            if [ ${#matches[@]} -eq 1 ]; then
              printf '%s\n' "${matches[0]}"
            elif [ ${#matches[@]} -gt 1 ]; then
              echo "Ambiguous Homebrew artifact path under $root: $expected" >&2
            fi
          }

          find_app_payload() {
            local root="$1"
            local expected="$2"
            local result=""
            if [ -n "$expected" ]; then
              result=$(find_declared_payload "$root" "$expected" app)
            else
              result=$(find -P "$root" -type d -name "*.app" ! -path "*/__MACOSX/*" \
                -prune -print 2>/dev/null | awk '{ print length, $0 }' | sort -n | head -1 | cut -d" " -f2-)
              [ -z "$result" ] || result=$(resolved_payload_path "$root" "$result" 2>/dev/null || true)
            fi
            if [ -n "$result" ] && [ -f "$result/Contents/Info.plist" ]; then
              printf '%s\n' "$result"
            fi
          }

          find_pkg_payload() {
            local root="$1"
            local expected="$2"
            if [ -n "$expected" ]; then
              find_declared_payload "$root" "$expected" pkg
            else
              find -P "$root" -type f -name "*.pkg" ! -path "*/__MACOSX/*" -print -quit 2>/dev/null
            fi
          }

          safe_blob_leaf() {
            [[ "$1" =~ ^[A-Za-z0-9._@+=-]+\.pkg$ ]] && [[ "$1" != .* ]]
          }

          verified_source_identity_matches() {
            local prior_version="$1"
            local current_version="$2"
            local prior_sha="$3"
            local current_sha="$4"
            [ -n "$current_version" ] \
              && [ "$prior_version" = "$current_version" ] \
              && [[ "$current_sha" =~ ^[0-9a-fA-F]{64}$ ]] \
              && [ "$prior_sha" = "$current_sha" ]
          }

          configured_blob_leaf() {
            local blob_url="$1"
            local leaf=""
            case "$blob_url" in
              "$STORAGE_BASE_URL"/*) leaf="${blob_url#"$STORAGE_BASE_URL"/}" ;;
              *) return 1 ;;
            esac
            safe_blob_leaf "$leaf" || return 1
            printf '%s\n' "$leaf"
          }

          reusable_blob_leaf() {
            local blob_url="$1"
            local leaf=""
            case "$blob_url" in
              "$STORAGE_BASE_URL"/*) leaf="${blob_url#"$STORAGE_BASE_URL"/}" ;;
              https://*.blob.core.windows.net/"$AZURE_STORAGE_CONTAINER"/*)
                leaf="${blob_url##*/}"
                ;;
              *) return 1 ;;
            esac
            safe_blob_leaf "$leaf" || return 1
            printf '%s\n' "$leaf"
          }

          immutable_blob_exists() {
            [ "$(az storage blob exists \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --container-name "$AZURE_STORAGE_CONTAINER" \
              --auth-mode login \
              --name "$1" \
              --query exists \
              -o tsv)" = "true" ]
          }

          verify_blob_sha() {
            local blob_name="$1"
            local expected_sha="$2"
            local temp_pkg=""
            local actual_sha=""
            local expected_lower=""
            [[ "$expected_sha" =~ ^[0-9a-fA-F]{64}$ ]] || return 1
            expected_lower=$(printf '%s' "$expected_sha" | tr 'A-F' 'a-f')
            temp_pkg=$(mktemp "${TMPDIR:-/tmp}/intunebrew-verify.XXXXXX.pkg") || return 1
            if ! az storage blob download \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --container-name "$AZURE_STORAGE_CONTAINER" \
              --auth-mode login \
              --name "$blob_name" \
              --file "$temp_pkg" \
              --no-progress >/dev/null; then
              rm -f "$temp_pkg"
              return 1
            fi
            actual_sha=$(shasum -a 256 "$temp_pkg" | awk '{print $1}')
            rm -f "$temp_pkg"
            [ "$actual_sha" = "$expected_lower" ]
          }

          prior_blob_sha_matches() {
            local prior_is_configured="$1"
            local blob_name="$2"
            local expected_sha="$3"
            local expected_lower=""
            expected_lower=$(printf '%s' "$expected_sha" | tr 'A-F' 'a-f')
            if [ "$prior_is_configured" = true ] \
              && [ "$blob_name" = "${blob_name%_"$expected_lower".pkg}_${expected_lower}.pkg" ]; then
              return 0
            fi
            verify_blob_sha "$blob_name" "$expected_lower"
          }

          upload_immutable_blob() {
            local package_path="$1"
            local blob_name="$2"
            safe_blob_leaf "$blob_name" || {
              echo "Unsafe immutable blob name: $blob_name" >&2
              return 1
            }
            if immutable_blob_exists "$blob_name"; then
              echo "Immutable blob already exists: $blob_name"
              return 0
            fi
            if az storage blob upload \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --container-name "$AZURE_STORAGE_CONTAINER" \
              --auth-mode login \
              --file "$package_path" \
              --name "$blob_name" \
              --overwrite false; then
              return 0
            fi
            # A concurrent run may have created the same content-addressed blob.
            immutable_blob_exists "$blob_name"
          }

          record_prior_blob_cleanup() {
            local prior_blob="$1"
            local new_blob="$2"
            [ -n "$prior_blob" ] || return 0
            safe_blob_leaf "$prior_blob" || return 1
            [ "$prior_blob" != "$new_blob" ] || return 0
            printf '%s\n' "$prior_blob" >> "$WORKSPACE_DIR/superseded-blobs.txt"
            return 0
          }

          : > "$WORKSPACE_DIR/superseded-blobs.txt"
          ERROR_LOG=()  # Track errors for summary
          FAILED_APPS=()  # Track which apps failed
          SUCCESSFUL_APPS=()  # Track successful apps
          
          for app_info in $APPS_TO_BUILD; do
            IFS=':' read -r app_name ignored_url <<< "$app_info"
            
            echo "🔄 Processing $app_name..."
            
            # Check if JSON file exists
            if [ ! -f "$WORKSPACE_DIR/Apps/${app_name}.json" ]; then
              echo "📝 JSON file for $app_name doesn't exist. Creating new JSON file..."
              cat > "$WORKSPACE_DIR/Apps/${app_name}.json" << 'EOF'
              {
                "display_name": "APP_NAME",
                "version": "0.0.0",
                "url": "URL",
                "type": "app",
                "installer_type": "pkg",
                "download_page": "",
                "previous_version": ""
              }
          EOF
              sed -i '' "s/APP_NAME/$app_name/g" "$WORKSPACE_DIR/Apps/${app_name}.json"
              sed -i '' "s|URL|$ignored_url|g" "$WORKSPACE_DIR/Apps/${app_name}.json"
              echo "✅ Created new JSON file for $app_name"
            else
              echo "📄 Using existing JSON file for $app_name"
            fi

            prior_manifest=$(git -C "$WORKSPACE_DIR" show "HEAD:Apps/${app_name}.json" 2>/dev/null || true)
            prior_catalog_url=$(printf '%s' "$prior_manifest" | jq -r '.url // empty' 2>/dev/null || true)
            prior_vendor_url=$(printf '%s' "$prior_manifest" | jq -r '.vendor_url // empty' 2>/dev/null || true)
            prior_version=$(printf '%s' "$prior_manifest" | jq -r '.version // empty' 2>/dev/null || true)
            prior_sha=$(printf '%s' "$prior_manifest" | jq -r '.sha // empty' 2>/dev/null || true)
            prior_source_version=$(printf '%s' "$prior_manifest" | jq -r '.source_version // empty' 2>/dev/null || true)
            prior_source_sha=$(printf '%s' "$prior_manifest" | jq -r '.source_sha256 // empty' 2>/dev/null || true)
            prior_blob=$(reusable_blob_leaf "$prior_catalog_url" 2>/dev/null || true)
            cleanup_prior_blob=$(configured_blob_leaf "$prior_catalog_url" 2>/dev/null || true)
            prior_is_configured=false
            [ -z "$cleanup_prior_blob" ] || prior_is_configured=true

            catalog_url=$(jq -r '.url // empty' "$WORKSPACE_DIR/Apps/${app_name}.json")
            vendor_url=$(jq -r '.vendor_url // empty' "$WORKSPACE_DIR/Apps/${app_name}.json")
            if [ -n "$vendor_url" ] && ! is_storage_package_url "$vendor_url"; then
              url="$vendor_url"
            else
              url="$catalog_url"
            fi
            
            # Get version and type from JSON file
            version=$(jq -r '.version' "$WORKSPACE_DIR/Apps/${app_name}.json")
            source_version=$(jq -r '.source_version // empty' "$WORKSPACE_DIR/Apps/${app_name}.json")
            source_sha=$(jq -r '.source_sha256 // empty' "$WORKSPACE_DIR/Apps/${app_name}.json")
            app_type=$(jq -r '.type' "$WORKSPACE_DIR/Apps/${app_name}.json")
            echo "📦 Version: $version"
            echo "🏷️ Type: $app_type"
            
            # Skip if not a supported type
            if [ "$app_type" != "app" ] && [ "$app_type" != "pkg_in_dmg" ] && [ "$app_type" != "pkg_in_pkg" ]; then
              echo "Skipping URL update for $app_name as it's not of type 'app', 'pkg_in_dmg', or 'pkg_in_pkg'"
              continue
            fi
            
            reuse_existing_blob=false
            if [ "$prior_version" = "$version" ] \
              && verified_source_identity_matches \
                "$prior_source_version" "$source_version" \
                "$prior_source_sha" "$source_sha" \
              && [[ "$prior_sha" =~ ^[0-9a-fA-F]{64}$ ]] \
              && [ -n "$prior_blob" ] \
              && immutable_blob_exists "$prior_blob"; then
              if prior_blob_sha_matches "$prior_is_configured" "$prior_blob" "$prior_sha"; then
                reuse_existing_blob=true
              else
                echo "Exact prior blob failed SHA verification; rebuilding $app_name"
              fi
            fi

            if [ "$reuse_existing_blob" = true ]; then
              if is_storage_package_url "$url"; then
                prior_vendor_url=""
              fi

              if [ -n "$prior_vendor_url" ] && [ -n "$url" ] && [ "$prior_vendor_url" != "$url" ]; then
                echo "Rebuilding $app_name: vendor artifact changed from $prior_vendor_url to $url"
                reuse_existing_blob=false
              fi
            fi

            if [ "$reuse_existing_blob" = true ]; then
              echo "Reusing exact manifest blob: $prior_blob"
              azure_url="${STORAGE_BASE_URL}/${prior_blob}"
              if ! jq --arg url "$azure_url" --arg version "$version" --arg prev_version "$prior_version" --arg sha "$prior_sha" --arg filename "$prior_blob" '(if has("vendor_url") then .vendor_url else .url end) as $vurl | .url = $url | .vendor_url = $vurl | .version = $version | .previous_version = $prev_version | .sha = $sha | .fileName = $filename | del(.packaging_pending)' "$WORKSPACE_DIR/Apps/${app_name}.json" > temp.json || ! mv temp.json "$WORKSPACE_DIR/Apps/${app_name}.json"; then
                FAILED_APPS+=("$app_name")
                ERROR_LOG+=("$app_name: Failed to update catalog JSON for exact existing package")
              fi
              continue
            fi
            
            if [ "$app_type" = "pkg_in_pkg" ]; then
              echo "Processing PKG in PKG for $app_name..."
              echo "Downloading from: $url"

              # Set download path
              download_path="$HOME/Desktop/${app_name}"
              outer_pkg_path="${download_path}.pkg"

              # Check if URL is a ZIP file. Both branches record whether the
              # outer package actually materialized, because the shared test
              # below can no longer read $? across them under errexit.
              outer_pkg_ready=false
              if [[ "$url" == *".zip" ]]; then
                echo "URL is a ZIP file, downloading and extracting first..."
                if ! curl -f -L -o "${download_path}.zip" "$url"; then
                  echo "Failed to download ZIP file"
                  FAILED_APPS+=("$app_name")
                  ERROR_LOG+=("$app_name: Failed to download ZIP from $url")
                  continue
                fi

                # Extract ZIP to find the PKG inside
                zip_extract_dir="${download_path}_zip_extracted"
                rm -rf "$zip_extract_dir"
                mkdir -p "$zip_extract_dir"
                # A corrupt archive must not abort the step: the found_pkg test
                # below owns that failure and reports it per app.
                unzip -q "${download_path}.zip" -d "$zip_extract_dir" || true

                # Find the PKG file inside the ZIP
                found_pkg=$(find "$zip_extract_dir" -name "*.pkg" -type f -print -quit)
                if [ -z "$found_pkg" ]; then
                  echo "No PKG file found inside ZIP"
                  rm -rf "$zip_extract_dir" "${download_path}.zip"
                  FAILED_APPS+=("$app_name")
                  ERROR_LOG+=("$app_name: No PKG found inside ZIP from $url")
                  continue
                fi

                echo "Found PKG inside ZIP: $found_pkg"
                if cp "$found_pkg" "$outer_pkg_path"; then
                  outer_pkg_ready=true
                fi
                rm -rf "$zip_extract_dir" "${download_path}.zip"
              else
                # Direct PKG download
                if curl -f -L -o "$outer_pkg_path" "$url"; then
                  outer_pkg_ready=true
                fi
              fi

              if [ "$outer_pkg_ready" = true ] && [ -f "$outer_pkg_path" ]; then
                echo "PKG download/extraction successful"
                ls -lh "$outer_pkg_path"

                # Prepare temporary directory for extraction
                echo "Preparing temporary directory for extraction"
                temp_dir="${download_path}_extracted"
                # Remove directory if it exists
                if [ -d "$temp_dir" ]; then
                  echo "Removing existing directory: $temp_dir"
                  rm -rf "$temp_dir"
                fi

                # Extract PKG (pkgutil will create the directory)
                echo "Extracting outer PKG..."
                if pkgutil --expand "$outer_pkg_path" "$temp_dir" 2>/dev/null; then
                  echo "✅ PKG extraction successful"
                  echo "📁 Extracted contents:"
                  ls -R "$temp_dir"
                  
                  # Find inner PKG (file or directory)
                  echo "🔍 Searching for inner PKG..."
                  inner_pkg=$(find "$temp_dir" -name "*.pkg" -type f -print -quit)
                  
                  if [ -n "$inner_pkg" ]; then
                    # Found a .pkg file
                    echo "✅ Found inner PKG file: $inner_pkg"
                    echo "📦 Package size: $(ls -lh "$inner_pkg" | awk '{print $5}')"
                    
                    # Copy inner PKG file with version in filename
                    echo "📋 Copying inner PKG file to ${app_name}_${version}.pkg"
                    # A failed copy leaves no package to upload, which the Azure
                    # upload arm below already reports for this app.
                    cp "$inner_pkg" "${app_name}_${version}.pkg" || true
                  else
                    # Check if there's a .pkg directory (flat package)
                    inner_pkg_dir=$(find "$temp_dir" -name "*.pkg" -type d -print -quit)
                    if [ -n "$inner_pkg_dir" ]; then
                      echo "✅ Found flat package directory: $inner_pkg_dir"
                      echo "📦 Flattening package to ${app_name}_${version}.pkg"
                      
                      # Use pkgutil to flatten the package
                      if ! pkgutil --flatten "$inner_pkg_dir" "${app_name}_${version}.pkg"; then
                        echo "❌ Failed to flatten package"
                        rm -rf "$temp_dir"
                        rm -f "${download_path}.pkg"
                        FAILED_APPS+=("$app_name")
                        ERROR_LOG+=("$app_name: Failed to flatten inner PKG from $url")
                        continue
                      fi
                    else
                      echo "❌ No inner PKG found"
                      rm -rf "$temp_dir"
                      rm -f "${download_path}.pkg"
                      FAILED_APPS+=("$app_name")
                      ERROR_LOG+=("$app_name: No inner PKG found after expanding $url")
                      continue
                    fi
                  fi
                  
                  extracted_bundle_id=$(extract_bundle_id_from_pkg "${app_name}_${version}.pkg")
                  log_bundle_id_change "$WORKSPACE_DIR/Apps/${app_name}.json" "$extracted_bundle_id"

                  # Calculate SHA256 hash
                  echo "🔐 Calculating SHA256 hash..."
                  file_hash=$(shasum -a 256 "${app_name}_${version}.pkg" | awk '{print $1}')
                  echo "📝 SHA256: $file_hash"
                  new_blob_name="${app_name}_${version}_${file_hash}.pkg"
                  azure_url="${STORAGE_BASE_URL}/${new_blob_name}"

                  if upload_immutable_blob "${app_name}_${version}.pkg" "$new_blob_name"; then
                    echo "✅ Upload successful"
                    record_prior_blob_cleanup "$cleanup_prior_blob" "$new_blob_name"

                    # Update JSON with Azure URL and SHA256
                    echo "📝 Updating JSON file with new Azure URL and SHA256..."
                    if jq --arg url "$azure_url" --arg filename "$new_blob_name" --arg sha "$file_hash" --arg bundleid "$extracted_bundle_id" '(if has("vendor_url") then .vendor_url else .url end) as $vurl | .url = $url | .vendor_url = $vurl | .fileName = $filename | .sha = $sha | (if $bundleid == "" then . else .bundleId = $bundleid end) | del(.packaging_pending)' "$WORKSPACE_DIR/Apps/${app_name}.json" > temp.json && mv temp.json "$WORKSPACE_DIR/Apps/${app_name}.json"; then
                      echo "✅ JSON file updated successfully"
                      echo "🔗 New URL: $azure_url"
                    else
                      echo "❌ Failed to update JSON file"
                      FAILED_APPS+=("$app_name")
                      ERROR_LOG+=("$app_name: Failed to update catalog JSON after Azure upload")
                      rm -f "${download_path}.pkg"
                      rm -rf "$temp_dir"
                      continue
                    fi
                  else
                    echo "❌ Failed to upload to Azure"
                    rm -f "${download_path}.pkg"
                    rm -rf "$temp_dir"
                    FAILED_APPS+=("$app_name")
                    ERROR_LOG+=("$app_name: Immutable Azure upload failed for $new_blob_name")
                    continue
                  fi
                else
                  echo "❌ Failed to extract PKG for $app_name"
                  rm -f "${download_path}.pkg"
                  rm -rf "$temp_dir"
                  FAILED_APPS+=("$app_name")
                  ERROR_LOG+=("$app_name: Failed to extract pkg_in_pkg from $url")
                  continue
                fi

                # Cleanup
                echo "🧹 Cleaning up..."
                echo "🗑️ Removing temporary files..."
                rm -f "${download_path}.pkg"
                rm -rf "$temp_dir"
                echo "✨ Cleanup complete"
              else
                echo "❌ Failed to download PKG"
                rm -f "$outer_pkg_path"
                FAILED_APPS+=("$app_name")
                ERROR_LOG+=("$app_name: Failed to download outer PKG from $url")
                continue
              fi
              
            elif [ "$app_type" = "pkg_in_dmg" ]; then
              echo "🔍 Processing PKG in DMG for $app_name..."
              echo "📥 Downloading DMG from: $url"
              
              # Set download path
              download_path="$HOME/Desktop/${app_name}"
              
              # Download DMG
              if curl -f -L -o "${download_path}.dmg" "$url"; then
                echo "✅ DMG download successful"
                ls -lh "${download_path}.dmg"
              else
                echo "❌ Failed to download DMG"
                rm -f "${download_path}.dmg"
                FAILED_APPS+=("$app_name")
                ERROR_LOG+=("$app_name: Failed to download DMG from $url")
                continue
              fi
              
              # Create mount point
              echo "📂 Creating mount point at ${download_path}_mount"
              # Remove mount point if it exists
              if [ -d "${download_path}_mount" ]; then
                echo "🧹 Removing existing mount point: ${download_path}_mount"
                # Try to unmount first if it's mounted
                hdiutil detach "${download_path}_mount" 2>/dev/null || true
                rm -rf "${download_path}_mount"
              fi
              mkdir -p "${download_path}_mount"
              
              # Mount DMG
              echo "💿 Mounting DMG..."
              if hdiutil attach "${download_path}.dmg" -mountpoint "${download_path}_mount" -nobrowse 2>/dev/null; then
                echo "✅ DMG mounted successfully"
                echo "📁 Mount point contents:"
                ls -la "${download_path}_mount"
              else
                echo "❌ Failed to mount DMG"
                rm -f "${download_path}.dmg"
                rm -rf "${download_path}_mount"
                FAILED_APPS+=("$app_name")
                ERROR_LOG+=("$app_name: Could not mount DMG from $url")
                continue
              fi
              
              # Find PKG file
              echo "🔍 Searching for PKG file..."
              pkg_file=$(find "${download_path}_mount" -name "*.pkg" -print -quit)

              # The DMG must be unmounted whether this succeeds or not, so
              # failures set a flag here and are recorded after the cleanup.
              pkg_in_dmg_error=""
              if [ -n "$pkg_file" ]; then
                echo "✅ Found PKG file: $pkg_file"
                echo "📦 Package size: $(ls -lh "$pkg_file" | awk '{print $5}')"
                
                # Copy PKG file with version in filename
                echo "📋 Copying PKG file to ${app_name}_${version}.pkg"
                # A failed copy leaves no package to upload, which the Azure
                # upload arm below already reports for this app.
                cp "$pkg_file" "${app_name}_${version}.pkg" || true

                extracted_bundle_id=$(extract_bundle_id_from_pkg "${app_name}_${version}.pkg")
                log_bundle_id_change "$WORKSPACE_DIR/Apps/${app_name}.json" "$extracted_bundle_id"
                
                # Calculate SHA256 hash
                echo "🔐 Calculating SHA256 hash..."
                file_hash=$(shasum -a 256 "${app_name}_${version}.pkg" | awk '{print $1}')
                echo "📝 SHA256: $file_hash"
                new_blob_name="${app_name}_${version}_${file_hash}.pkg"
                azure_url="${STORAGE_BASE_URL}/${new_blob_name}"

                if upload_immutable_blob "${app_name}_${version}.pkg" "$new_blob_name"; then
                  echo "✅ Upload successful"
                  record_prior_blob_cleanup "$cleanup_prior_blob" "$new_blob_name"

                  # Update JSON with Azure URL and SHA256
                  echo "📝 Updating JSON file with new Azure URL and SHA256..."
                  if jq --arg url "$azure_url" --arg filename "$new_blob_name" --arg sha "$file_hash" --arg bundleid "$extracted_bundle_id" '(if has("vendor_url") then .vendor_url else .url end) as $vurl | .url = $url | .vendor_url = $vurl | .fileName = $filename | .sha = $sha | (if $bundleid == "" then . else .bundleId = $bundleid end) | del(.packaging_pending)' "$WORKSPACE_DIR/Apps/${app_name}.json" > temp.json && mv temp.json "$WORKSPACE_DIR/Apps/${app_name}.json"; then
                    echo "✅ JSON file updated successfully"
                    echo "🔗 New URL: $azure_url"
                  else
                    echo "❌ Failed to update JSON file"
                    pkg_in_dmg_error="Failed to update catalog JSON after Azure upload"
                  fi
                else
                  echo "❌ Failed to upload to Azure"
                  pkg_in_dmg_error="Immutable Azure upload failed for $new_blob_name"
                fi
              else
                echo "❌ No PKG file found in DMG for $app_name"
                echo "📁 Contents of mount point:"
                ls -R "${download_path}_mount"
                pkg_in_dmg_error="No PKG found inside DMG from $url"
              fi

              # Cleanup
              echo "🧹 Cleaning up..."
              echo "💿 Unmounting DMG..."
              hdiutil detach "${download_path}_mount" 2>/dev/null || true
              echo "🗑️ Removing temporary files..."
              rm -f "${download_path}.dmg"
              rm -rf "${download_path}_mount"
              echo "✨ Cleanup complete"

              if [ -n "$pkg_in_dmg_error" ]; then
                FAILED_APPS+=("$app_name")
                ERROR_LOG+=("$app_name: $pkg_in_dmg_error")
                continue
              fi

            else
              # Download app
              echo "Downloading $app_name..."
              download_path="$HOME/Desktop/${app_name}"
              extract_dir="$HOME/Desktop/${app_name}_extracted"
              mount_dir="$HOME/Desktop/${app_name}_mount"
              rm -rf "$extract_dir" "$mount_dir"
              mkdir -p "$extract_dir"
              declared_app=$(jq -r '.artifact_app // empty' "$WORKSPACE_DIR/Apps/${app_name}.json")
              declared_pkg=$(jq -r '.artifact_pkg // empty' "$WORKSPACE_DIR/Apps/${app_name}.json")
              kind=$(jq -r '.artifact_kind // empty' "$WORKSPACE_DIR/Apps/${app_name}.json")
              archive_format=$(jq -r '.archive_format // empty' "$WORKSPACE_DIR/Apps/${app_name}.json")
              [ -n "$kind" ] || kind=$(artifact_kind "$url")

              case "$kind" in
                pkg)
                  if ! curl -f -L -o "$extract_dir/${declared_pkg:-payload.pkg}" "$url"; then
                    FAILED_APPS+=("$app_name")
                    ERROR_LOG+=("$app_name: Failed to download direct PKG from $url")
                    rm -rf "$extract_dir"
                    continue
                  fi
                  ;;
                dmg|dmg_gzip)
                  if [ "$kind" = "dmg_gzip" ]; then
                    if ! curl -f -L -o "${download_path}.dmg.gz" "$url"; then
                      FAILED_APPS+=("$app_name")
                      ERROR_LOG+=("$app_name: Failed to download gzip-compressed DMG from $url")
                      rm -rf "$extract_dir"
                      continue
                    fi
                    if ! gunzip -c "${download_path}.dmg.gz" > "${download_path}.dmg"; then
                      FAILED_APPS+=("$app_name")
                      ERROR_LOG+=("$app_name: Failed to decompress DMG from $url")
                      rm -rf "$extract_dir"
                      rm -f "${download_path}.dmg.gz" "${download_path}.dmg"
                      continue
                    fi
                    rm -f "${download_path}.dmg.gz"
                  elif ! curl -f -L -o "${download_path}.dmg" "$url"; then
                    FAILED_APPS+=("$app_name")
                    ERROR_LOG+=("$app_name: Failed to download DMG from $url")
                    rm -rf "$extract_dir"
                    continue
                  fi
                  mkdir -p "$mount_dir"
                  if ! hdiutil attach "${download_path}.dmg" -mountpoint "$mount_dir" -nobrowse >/dev/null; then
                    FAILED_APPS+=("$app_name")
                    ERROR_LOG+=("$app_name: Could not mount DMG from $url")
                    rm -rf "$extract_dir" "$mount_dir"
                    rm -f "${download_path}.dmg"
                    continue
                  fi
                  mounted_app=$(find_app_payload "$mount_dir" "$declared_app")
                  mounted_pkg=$(find_pkg_payload "$mount_dir" "$declared_pkg")
                  if [ -n "$mounted_app" ]; then
                    ditto "$mounted_app" "$extract_dir/$(basename "$mounted_app")"
                  elif [ -n "$mounted_pkg" ]; then
                    cp "$mounted_pkg" "$extract_dir/$(basename "$mounted_pkg")"
                  fi
                  hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
                  rm -rf "$mount_dir"
                  rm -f "${download_path}.dmg"
                  ;;
                archive)
                  archive_path="${download_path}.archive"
                  if ! curl -f -L -o "$archive_path" "$url"; then
                    FAILED_APPS+=("$app_name")
                    ERROR_LOG+=("$app_name: Failed to download archive from $url")
                    rm -rf "$extract_dir"
                    continue
                  fi
                  if [ -z "$archive_format" ]; then
                    url_path="${url%%\?*}"
                    url_path=$(printf '%s' "$url_path" | tr '[:upper:]' '[:lower:]')
                    case "$url_path" in
                      *.zip) archive_format="zip" ;;
                      *.tar.gz|*.tgz) archive_format="tar.gz" ;;
                      *.tar.xz) archive_format="tar.xz" ;;
                      *.tar.bz2|*.tbz) archive_format="tar.bz2" ;;
                    esac
                  fi
                  case "$archive_format" in
                    zip)
                      extraction_ok=false
                      ditto -x -k "$archive_path" "$extract_dir" && extraction_ok=true
                      ;;
                    tar.gz)
                      extraction_ok=false
                      tar -xzf "$archive_path" -C "$extract_dir" && extraction_ok=true
                      ;;
                    tar.xz)
                      extraction_ok=false
                      tar -xJf "$archive_path" -C "$extract_dir" && extraction_ok=true
                      ;;
                    tar.bz2)
                      extraction_ok=false
                      tar -xjf "$archive_path" -C "$extract_dir" && extraction_ok=true
                      ;;
                  esac
                  rm -f "$archive_path"
                  if [ "${extraction_ok:-false}" != "true" ]; then
                    FAILED_APPS+=("$app_name")
                    ERROR_LOG+=("$app_name: Failed to extract archive from $url")
                    rm -rf "$extract_dir"
                    continue
                  fi

                  app_file=$(find_app_payload "$extract_dir" "$declared_app")
                  pkg_file=$(find_pkg_payload "$extract_dir" "$declared_pkg")
                  if [ -z "$app_file" ] && [ -z "$pkg_file" ]; then
                    nested_dmg=$(find "$extract_dir" -type f -name "*.dmg" -print -quit)
                    if [ -n "$nested_dmg" ]; then
                      mkdir -p "$mount_dir"
                      if hdiutil attach "$nested_dmg" -mountpoint "$mount_dir" -nobrowse >/dev/null; then
                        mounted_app=$(find_app_payload "$mount_dir" "$declared_app")
                        mounted_pkg=$(find_pkg_payload "$mount_dir" "$declared_pkg")
                        if [ -n "$mounted_app" ]; then
                          ditto "$mounted_app" "$extract_dir/$(basename "$mounted_app")"
                        elif [ -n "$mounted_pkg" ]; then
                          cp "$mounted_pkg" "$extract_dir/$(basename "$mounted_pkg")"
                        fi
                        hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
                      fi
                      rm -rf "$mount_dir"
                    fi
                  fi
                  ;;
                *)
                  FAILED_APPS+=("$app_name")
                  ERROR_LOG+=("$app_name: Unsupported artifact URL: $url")
                  rm -rf "$extract_dir"
                  continue
                  ;;
              esac

              cd "$HOME/Desktop"
              echo "🔍 Searching for declared app payload..."
              app_file=$(find_app_payload "$extract_dir" "$declared_app")
              
              if [ -z "$app_file" ]; then
                echo "❌ No .app file found, searching for .pkg file..."
                pkg_file=$(find_pkg_payload "$extract_dir" "$declared_pkg")
                
                if [ -n "$pkg_file" ]; then
                  echo "✅ Found .pkg file: $pkg_file"
                  echo "📦 Package size: $(ls -lh "$pkg_file" | awk '{print $5}')"
                  
                  # Copy PKG file with version in filename
                  echo "📋 Copying PKG file to ${app_name}_${version}.pkg"
                  # A failed copy leaves no package to upload, which the Azure
                  # upload arm below already reports for this app.
                  cp "$pkg_file" "${app_name}_${version}.pkg" || true

                  extracted_bundle_id=$(extract_bundle_id_from_pkg "${app_name}_${version}.pkg")
                  log_bundle_id_change "$WORKSPACE_DIR/Apps/${app_name}.json" "$extracted_bundle_id"
                  
                  # Calculate SHA256 hash
                  echo "🔐 Calculating SHA256 hash..."
                  file_hash=$(shasum -a 256 "${app_name}_${version}.pkg" | awk '{print $1}')
                  echo "📝 SHA256: $file_hash"
                  new_blob_name="${app_name}_${version}_${file_hash}.pkg"
                  azure_url="${STORAGE_BASE_URL}/${new_blob_name}"

                  if upload_immutable_blob "${app_name}_${version}.pkg" "$new_blob_name"; then
                    echo "✅ Upload successful"
                    record_prior_blob_cleanup "$cleanup_prior_blob" "$new_blob_name"

                    # Update JSON with Azure URL and SHA256
                    echo "📝 Updating JSON file with new Azure URL and SHA256..."
                    if jq --arg url "$azure_url" --arg filename "$new_blob_name" --arg sha "$file_hash" --arg bundleid "$extracted_bundle_id" '(if has("vendor_url") then .vendor_url else .url end) as $vurl | .url = $url | .vendor_url = $vurl | .fileName = $filename | .sha = $sha | (if $bundleid == "" then . else .bundleId = $bundleid end) | del(.packaging_pending)' "$WORKSPACE_DIR/Apps/${app_name}.json" > temp.json && mv temp.json "$WORKSPACE_DIR/Apps/${app_name}.json"; then
                      echo "✅ JSON file updated successfully"
                      echo "🔗 New URL: $azure_url"
                    else
                      echo "❌ Failed to update JSON file"
                      cd "$WORKSPACE_DIR"
                      rm -rf "${app_name}_extracted"
                      FAILED_APPS+=("$app_name")
                      ERROR_LOG+=("$app_name: Failed to update catalog JSON after Azure upload")
                      continue
                    fi
                  else
                    echo "❌ Failed to upload to Azure"
                    cd "$WORKSPACE_DIR"
                    rm -rf "${app_name}_extracted"
                    FAILED_APPS+=("$app_name")
                    ERROR_LOG+=("$app_name: Immutable Azure upload failed for $new_blob_name")
                    continue
                  fi

                  # Clean up and continue to next app. This path bypasses the
                  # shared success counter at the end of the loop, so it counts
                  # itself.
                  cd "$WORKSPACE_DIR"
                  rm -rf "${app_name}_extracted"
                  SUCCESSFUL_APPS+=("$app_name")
                  echo "✅ Completed processing $app_name"
                  continue
                else
                  echo "❌ No .app or .pkg file found for $app_name"
                  echo " Extracted contents:"
                  ls -R "${app_name}_extracted"
                  cd "$WORKSPACE_DIR"
                  rm -rf "${app_name}_extracted"
                  FAILED_APPS+=("$app_name")
                  ERROR_LOG+=("$app_name: No .app or .pkg found inside archive from $url")
                  continue
                fi
              fi
              echo "✅ Found .app file: $app_file"
              
              extracted_bundle_id=$(extract_bundle_id_from_plist "$app_file/Contents/Info.plist")
              log_bundle_id_change "$WORKSPACE_DIR/Apps/${app_name}.json" "$extracted_bundle_id"

              # Build PKG with version in filename
              echo "Building PKG for $app_name version $version..."
              if ! pkgbuild --install-location /Applications --component "$app_file" "${app_name}_${version}.pkg" 2>/dev/null; then
                echo "❌ Failed to build PKG for $app_name"
                rm -rf "${app_name}_extracted"
                FAILED_APPS+=("$app_name")
                ERROR_LOG+=("$app_name: Failed to build PKG from .app file")
                continue
              fi
              
              # Calculate SHA256 hash
              echo "🔐 Calculating SHA256 hash..."
              file_hash=$(shasum -a 256 "${app_name}_${version}.pkg" | awk '{print $1}')
              echo "📝 SHA256: $file_hash"
              new_blob_name="${app_name}_${version}_${file_hash}.pkg"
              azure_url="${STORAGE_BASE_URL}/${new_blob_name}"

              # Upload to Azure with version in filename. The old versions are
              # only deleted and the JSON only rewritten after a confirmed
              # upload, otherwise a transient Azure failure would remove the
              # last working package and leave the catalog pointing at nothing.
              echo "Uploading $app_name version $version to Azure Blob Storage..."
              if ! upload_immutable_blob "${app_name}_${version}.pkg" "$new_blob_name"; then
                echo "❌ Failed to upload $new_blob_name to Azure"
                sudo rm -rf "${app_name}_extracted"
                rm -f "${app_name}_${version}.pkg"
                FAILED_APPS+=("$app_name")
                ERROR_LOG+=("$app_name: Immutable Azure upload failed for $new_blob_name")
                continue
              fi

              # Defer deletion until the catalog marker has been published.
              record_prior_blob_cleanup "$cleanup_prior_blob" "$new_blob_name"

              # Update the JSON file with Azure URL, filename and SHA256
              # The package is already uploaded at this point, so a failed
              # rewrite must leave the JSON alone and let the loop continue
              # rather than take the remaining apps down with it.
              # Braces keep the negation on the whole list: "!" alone would bind
              # to jq and turn mv into the failure branch.
              if ! { jq --arg url "$azure_url" --arg filename "$new_blob_name" --arg sha "$file_hash" --arg bundleid "$extracted_bundle_id" '(if has("vendor_url") then .vendor_url else .url end) as $vurl | .url = $url | .vendor_url = $vurl | .fileName = $filename | .sha = $sha | (if $bundleid == "" then . else .bundleId = $bundleid end) | del(.packaging_pending)' "$WORKSPACE_DIR/Apps/${app_name}.json" > temp.json && mv temp.json "$WORKSPACE_DIR/Apps/${app_name}.json"; }; then
                echo "❌ Failed to update JSON file"
                sudo rm -rf "${app_name}_extracted"
                FAILED_APPS+=("$app_name")
                ERROR_LOG+=("$app_name: Failed to update catalog JSON after Azure upload")
                continue
              fi

              # Cleanup
              sudo rm -rf "${app_name}_extracted"
            fi

            SUCCESSFUL_APPS+=("$app_name")
            echo "✅ Completed processing $app_name"
            echo "------------------------------------------------"
          done

          # Never publish the collector's vendor URL or source-archive SHA for a
          # package that failed. Keep the last committed manifest until a build
          # produces and verifies a replacement.
          for failed_app in "${FAILED_APPS[@]}"; do
            if git -C "$WORKSPACE_DIR" cat-file -e "HEAD:Apps/${failed_app}.json" 2>/dev/null; then
              git -C "$WORKSPACE_DIR" checkout HEAD -- "Apps/${failed_app}.json"
            else
              rm -f "$WORKSPACE_DIR/Apps/${failed_app}.json"
            fi
          done
          
          # Display summary
          echo ""
          echo "========================================="
          echo "📊 PROCESSING SUMMARY"
          echo "========================================="
          
          # Count totals
          total_apps_processed=$((${#SUCCESSFUL_APPS[@]} + ${#FAILED_APPS[@]}))
          
          if [ ${#FAILED_APPS[@]} -gt 0 ]; then
            echo "⚠️ Some apps failed to process:"
            echo ""
            echo "Successfully processed: ${#SUCCESSFUL_APPS[@]} apps"
            echo "Failed: ${#FAILED_APPS[@]} apps"
            echo ""
            echo "Failed apps:"
            for failed_app in "${FAILED_APPS[@]}"; do
              echo "  ❌ $failed_app"
            done
            echo ""
            if [ ${#ERROR_LOG[@]} -gt 0 ]; then
              echo "Error details:"
              for error in "${ERROR_LOG[@]}"; do
                echo "  • $error"
              done
            fi
          else
            echo "✅ All $total_apps_processed apps processed successfully!"
          fi
          
          echo "========================================="
          
          # Write to GitHub Actions summary
          if [ ${#FAILED_APPS[@]} -gt 0 ]; then
            echo "## ⚠️ App Processing Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Total apps processed:** $total_apps_processed" >> $GITHUB_STEP_SUMMARY
            echo "**Successful:** ${#SUCCESSFUL_APPS[@]}" >> $GITHUB_STEP_SUMMARY
            echo "**Failed:** ${#FAILED_APPS[@]}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Apps" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for error in "${ERROR_LOG[@]}"; do
              echo "- $error" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "## ✅ App Processing Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All $total_apps_processed apps processed successfully!" >> $GITHUB_STEP_SUMMARY
          fi

          # Persist the failure list so a later step can maintain the
          # packaging-failures tracking issue. Absolute path: the loop above
          # cds into $HOME/Desktop for downloads and does not always return.
          echo "failed_count=${#FAILED_APPS[@]}" >> "$GITHUB_OUTPUT"
          if [ ${#FAILED_APPS[@]} -eq 0 ]; then
            echo "packaging_succeeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging_succeeded=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "Automated packaging report from $(date -u +%Y-%m-%d)."
            echo ""
            echo "Processed $total_apps_processed apps, ${#FAILED_APPS[@]} failed."
            echo ""
            if [ ${#ERROR_LOG[@]} -gt 0 ]; then
              echo "These apps could not be repackaged, so their catalog entries keep"
              echo "the previous package until a build succeeds. Failures listed here"
              echo "repeat night after night until the underlying cause is fixed or"
              echo "the app is deprecated."
              echo ""
              echo "| App | Error |"
              echo "| --- | --- |"
              for error in "${ERROR_LOG[@]}"; do
                echo "| ${error%%:*} | ${error#*: } |"
              done
            fi
          } > "$WORKSPACE_DIR/packaging-failures.md"

      # The collector rewrites every app's url to the vendor URL, and Process
      # apps restores the Azure URL only for the apps it packaged. On a scoped
      # build the unprocessed apps would therefore be committed pointing at
      # vendor URLs while their sha still describes the Azure package. Revert
      # everything the scoped build did not process; the nightly full run
      # refreshes those apps correctly.
      - name: Revert out-of-scope changes
        if: needs.collect.outputs.scope == 'partial'
        env:
          SCOPE_TOKENS: ${{ needs.collect.outputs.tokens }}
        run: |
          reverted=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            cask=$(jq -r '.homebrew_cask // empty' "$f" 2>/dev/null || true)
            if [ -z "$cask" ] || [[ " $SCOPE_TOKENS " != *" $cask "* ]]; then
              git checkout -- "$f"
              reverted=$((reverted + 1))
            fi
          done < <(git diff --name-only -- 'Apps/*.json')

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            cask=$(jq -r '.homebrew_cask // empty' "$f" 2>/dev/null || true)
            if [ -z "$cask" ] || [[ " $SCOPE_TOKENS " != *" $cask "* ]]; then
              rm -f "$f"
              reverted=$((reverted + 1))
            fi
          done < <(git ls-files --others --exclude-standard -- 'Apps/*.json')

          # README is regenerated from the collector's full refresh; keep it
          # consistent with the reverted JSONs rather than a day ahead of them.
          git checkout -- README.md 2>/dev/null || true

          echo "Reverted $reverted out-of-scope app files"

      - name: Refresh supported app index
        run: python .github/scripts/generate_supported_apps.py

      - name: Commit and push changes
        id: catalog-snapshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Apps/*.json supported_apps.json README.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update app information and supported apps list"
            if ! git push origin HEAD:main; then
              echo "::error::main changed while this run was building the catalog"
              exit 1
            fi
          fi

          # Capture the commit that proved catalog publication completed. The
          # final marker parent may also include this run's request bookkeeping,
          # so the marker step verifies this SHA remains in its ancestry.
          git fetch origin main
          catalog_commit=$(git rev-parse HEAD)
          remote_commit=$(git rev-parse origin/main)
          if [ "$catalog_commit" != "$remote_commit" ]; then
            echo "::error::Local catalog snapshot is not the current main commit"
            exit 1
          fi
          case "$catalog_commit" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *)
              echo "::error::Catalog snapshot is not an exact 40-character SHA"
              exit 1
              ;;
          esac
          git cat-file -e "$catalog_commit:supported_apps.json"
          echo "catalog_commit=$catalog_commit" >> "$GITHUB_OUTPUT"

      # Keep one tracking issue in sync with the packaging failures of full
      # builds. Scoped builds only process the apps a push added, so their
      # zero-failure result says nothing about the rest of the catalog and
      # must not close the issue.
      - name: Report packaging failures
        if: |
          needs.collect.outputs.scope != 'partial' &&
          steps.process-apps.outputs.failed_count != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_COUNT: ${{ steps.process-apps.outputs.failed_count }}
          ISSUE_TITLE: Packaging failures in app build
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)

          if [ "$FAILED_COUNT" != "0" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file packaging-failures.md
              echo "Updated issue #$number"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file packaging-failures.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Every app packaged successfully in the latest full build."
          fi

      - name: Require successful packaging
        if: steps.process-apps.outputs.packaging_succeeded != 'true'
        env:
          FAILED_COUNT: ${{ steps.process-apps.outputs.failed_count }}
        run: |
          echo "::error::Catalog publication blocked because ${FAILED_COUNT:-unknown} apps failed packaging"
          exit 1

      # Apps are only downloadable once the steps above have published them, so
      # this is the first point at which a requester can be told their app is live.
      - name: Resolve pending app requests
        id: pending
        run: python .github/scripts/pending_requests.py resolve

      - name: Notify requesters
        if: steps.pending.outputs.notify_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const notifications = JSON.parse(fs.readFileSync('pending-notifications.json', 'utf8'));

            for (const item of notifications) {
              let body = `## Now live\n\n`;
              body += `The app you requested has been packaged and is available in the catalog.\n\n`;
              body += `| App | Version |\n|-----|---------|\n`;
              for (const app of item.apps) {
                body += `| ${app.name} | \`${app.version}\` |\n`;
              }
              body += `\nIt will appear in IntuneBrew on the next run, and updates are `;
              body += `picked up automatically from Homebrew from here on.`;

              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.issue,
                  body: body
                });
                console.log(`Commented on #${item.issue}`);
              } catch (e) {
                // A deleted or locked issue must not fail the build.
                console.log(`Could not comment on #${item.issue}: ${e.message}`);
              }
            }

      - name: Commit resolved requests
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/pending-requests.json

          if git diff --staged --quiet; then
            echo "No pending request changes to commit"
            exit 0
          fi

          git commit -m "Clear resolved app requests [skip ci]"
          if ! git push origin HEAD:main; then
            echo "::error::main changed before pending requests could be committed"
            exit 1
          fi

      - name: Publish catalog state
        if: success() && steps.process-apps.outputs.packaging_succeeded == 'true'
        env:
          PUBLISHED_CATALOG_COMMIT: ${{ steps.catalog-snapshot.outputs.catalog_commit }}
          PACKAGE_STORAGE_BASE_URL: ${{ vars.AZURE_STORAGE_BASE_URL }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: Build App Packages and Collect App Information
          WORKFLOW_PATH: .github/workflows/build-app-packages.yml
        run: |
          # Do not rebase the marker. It is valid only when this checkout is still
          # the exact tip of main; a normal push also closes the remaining race.
          git fetch origin main
          local_head=$(git rev-parse HEAD)
          remote_head=$(git rev-parse origin/main)
          if [ "$local_head" != "$remote_head" ]; then
            echo "::error::main changed before catalog state publication"
            exit 1
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "::error::Tracked working tree changes remain before marker publication"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PUBLISHED_CATALOG_COMMIT" "$local_head"; then
            echo "::error::Catalog snapshot is not an ancestor of the marker parent"
            exit 1
          fi
          if git cat-file -e "$local_head:.github/catalog-state.json" 2>/dev/null; then
            existing_run_id=$(git show "$local_head:.github/catalog-state.json" \
              | python -c 'import json, sys; value=json.load(sys.stdin)["runId"]; assert type(value) is int and value > 0; print(value)')
            if [ "$existing_run_id" -ge "$RUN_ID" ]; then
              echo "::error::Existing catalog marker belongs to run $existing_run_id, which is not older than $RUN_ID"
              exit 1
            fi
          fi
          CATALOG_COMMIT="$local_head"

          python .github/scripts/catalog_state.py generate \
            --catalog-commit "$CATALOG_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-name "$WORKFLOW_NAME" \
            --workflow-path "$WORKFLOW_PATH" \
            --run-id "$RUN_ID" \
            --package-storage-base-url "$PACKAGE_STORAGE_BASE_URL" \
            --output .github/catalog-state.json
          python .github/scripts/catalog_state.py validate \
            --state-file .github/catalog-state.json \
            --catalog-commit "$CATALOG_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-name "$WORKFLOW_NAME" \
            --workflow-path "$WORKFLOW_PATH" \
            --run-id "$RUN_ID"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/catalog-state.json
          staged_files=$(git diff --cached --name-only)
          if [ "$staged_files" != ".github/catalog-state.json" ]; then
            echo "::error::Catalog marker commit would contain unexpected files"
            exit 1
          fi

          git commit -m "Publish catalog state for run $RUN_ID [skip ci]"
          marker_parent=$(git rev-parse HEAD^)
          if [ "$marker_parent" != "$local_head" ]; then
            echo "::error::Catalog marker parent changed unexpectedly"
            exit 1
          fi
          recorded_commit=$(python -c 'import json; print(json.load(open(".github/catalog-state.json"))["catalogCommit"])')
          if [ "$recorded_commit" != "$marker_parent" ]; then
            echo "::error::Catalog marker does not record its exact parent snapshot"
            exit 1
          fi

          # Never force: a concurrent main update must reject this publication.
          git push origin HEAD:main

      - name: Refresh Azure login for package cleanup
        uses: azure/login@v3
        env:
          AZURE_LOGIN_PRE_CLEANUP: true
          AZURE_LOGIN_POST_CLEANUP: true
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete superseded package blobs
        env:
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER }}
        run: |
          [ -s superseded-blobs.txt ] || {
            echo "No superseded package blobs to delete"
            exit 0
          }

          sort -u superseded-blobs.txt | while IFS= read -r blob_name; do
            [ -n "$blob_name" ] || continue
            if ! [[ "$blob_name" =~ ^[A-Za-z0-9._@+=-]+\.pkg$ ]] || [[ "$blob_name" = .* ]]; then
              echo "::warning::Skipping unsafe cleanup candidate: $blob_name"
              continue
            fi
            echo "Deleting superseded package blob: $blob_name"
            if ! az storage blob delete \
              --account-name "$AZURE_STORAGE_ACCOUNT" \
              --container-name "$AZURE_STORAGE_CONTAINER" \
              --auth-mode login \
              --name "$blob_name"; then
              echo "::warning::Could not delete superseded blob $blob_name; leaving it in storage"
            fi
          done
